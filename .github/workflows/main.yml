name: Build CallScheduler Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Permanent Release Keystore (Fixed Signature for In-Place Updates)
        run: |
          if [ -f app/release-keystore.b64 ]; then
            tr -d '\r\n ' < app/release-keystore.b64 | base64 --decode > app/release-keystore.jks
          else
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias callscheduler \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "CallScheduler2026!" \
              -keypass "CallScheduler2026!" \
              -dname "CN=CallScheduler, OU=Mobile, O=CallScheduler, L=Seoul, S=Seoul, C=KR"
          fi
          ls -lh app/release-keystore.jks

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Signed Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            ERR_MSG=$(grep -E '(^e: |FAILURE:|\* What went wrong:|> Task .* FAILED|Exception:|Error:)' build.log | head -n 15 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::$ERR_MSG"
            exit 1
          fi
          mkdir -p app/build/outputs/apk/release-ready
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release-ready/CallScheduler-signed-release.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallScheduler-signed-release-apk
          path: app/build/outputs/apk/release-ready/CallScheduler-signed-release.apk
